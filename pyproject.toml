[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicenotes"
version = "0.1.0"
description = "Local-first voice notes: speak Urdu or English, get clean English notes in Obsidian."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Apple-Silicon GPU backend (recommended on a Mac)
mac = ["mlx-whisper>=0.4", "rumps>=0.4; sys_platform == 'darwin'"]
# Cross-platform CPU backend
cpu = ["faster-whisper>=1.0"]
# ONNX backend (models from GitHub releases; used in CI)
onnx = ["sherpa-onnx>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
voicenotes = "voicenotes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicenotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs real models / network (deselect with -m 'not integration')",
]
